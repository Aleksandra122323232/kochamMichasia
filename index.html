<script>
    function checkPassword() {
      // Usuwa zbędne spacje, zamienia na małe litery
      const rawInput = document.getElementById('password-input').value.toLowerCase().trim();
      const input = rawInput.replace(/\s+/g, ' ');
      const errorMsg = document.getElementById('error-msg');
      
      // Akceptuje Katy i Bruno w każdej konfiguracji (małe/duże litery, ze spójnikiem lub bez)
      if (
        input === "katy i bruno" || 
        input === "bruno i katy" ||
        input === "katy bruno" ||
        input === "bruno katy" ||
        input === "katy, bruno" ||
        (input.includes("katy") && input.includes("bruno"))
      ) {
        document.getElementById('lock-screen').style.display = 'none';
        document.getElementById('main-content').style.display = 'flex';
      } else {
        errorMsg.style.display = 'block';
        const lockScreen = document.getElementById('lock-screen');
        lockScreen.style.transform = 'translateX(8px)';
        setTimeout(() => lockScreen.style.transform = 'translateX(-8px)', 100);
        setTimeout(() => lockScreen.style.transform = 'translateX(0)', 200);
      }
    }

    document.getElementById('password-input').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') {
        checkPassword();
      }
    });

    function flipCard(container) {
      container.classList.toggle('flipped');
    }
  </script>
